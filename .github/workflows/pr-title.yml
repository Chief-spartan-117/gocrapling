name: pr-title

# Squash merges use the PR title as the commit message, and release-please
# reads commit messages to pick the next version. Keep titles conventional.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
          scopes: |
            fetcher
            stealth
            parser
            spider
            service
            mcp
            rest
            server
            cli
            api
            sdk
            browserinstall
            docker
            skill
            deps
            n8n
          requireScope: false
