name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What are you trying to do that is hard or impossible today?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Idea, description: "How could it work? Which layer should own it (see docs/ARCHITECTURE.md)?" }
