[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gocrapling"
version = "0.1.0" # x-release-please-version
description = "Python client for the gocrapling scraping server (REST API)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/Chief-spartan-117/gocrapling"

[tool.setuptools]
packages = ["gocrapling"]

[tool.setuptools.package-data]
gocrapling = ["py.typed"]
