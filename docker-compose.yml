# Quick deploy:
#   export GOCRAPLING_MCP_TOKEN=$(openssl rand -hex 32)
#   docker compose up -d --build
#   curl -s -H "Authorization: Bearer $GOCRAPLING_MCP_TOKEN" -H 'Content-Type: application/json' \
#        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:8080/mcp
#
# One-off commands (no server):
#   docker compose run --rm cli fetch -markdown https://example.com
#   docker compose run --rm cli extract https://example.com /data/page.md
#   docker compose run --rm cli crawl -field 'title=h1::text' -depth 2 -out /data/items.jsonl https://example.com
#
# Scale the stateless MCP service behind your own load balancer (drop the
# fixed host port first): docker compose up -d --scale mcp=4

services:
  mcp:
    build: .
    image: gocrapling:local
    command:
      - mcp
      - -http
      - 0.0.0.0:8080
      - -state-dir
      - /data/state
    environment:
      # Required: a non-loopback bind refuses to start without a token.
      GOCRAPLING_MCP_TOKEN: ${GOCRAPLING_MCP_TOKEN:?set GOCRAPLING_MCP_TOKEN, e.g. openssl rand -hex 32}
    ports:
      # Loopback only. Put a TLS reverse proxy in front before exposing it.
      - "127.0.0.1:8080:8080"
    volumes:
      - gocrapling-data:/data
    shm_size: 1gb # Chrome crashes on Docker's 64 MB default /dev/shm
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Run ad hoc: docker compose run --rm cli <command>. Not started by `up`.
  cli:
    build: .
    image: gocrapling:local
    profiles: ["cli"]
    volumes:
      - gocrapling-data:/data
    shm_size: 1gb
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  gocrapling-data:
